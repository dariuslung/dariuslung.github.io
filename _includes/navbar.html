{% assign cv_file = site.static_files | where: "path", "/assets/cv.pdf" %}
<nav class="border-b border-rule bg-paper" aria-label="Main">
    <div class="max-w-4xl mx-auto px-6 py-3 flex justify-between items-center gap-3">
        <a class="text-lg font-semibold tracking-tight hover:text-signal-text" href="/">Darius Lung</a>

        <div class="flex items-center gap-4 sm:gap-6 text-sm">
            <a href="/" class="py-1 border-b-2 hover:text-signal-text {% if page.url == '/' %}border-signal{% else %}border-transparent{% endif %}" {% if page.url == '/' %}aria-current="page"{% endif %}>Home</a>
            <a href="/tools" class="py-1 border-b-2 hover:text-signal-text {% if page.url contains '/tools' %}border-signal{% else %}border-transparent{% endif %}" {% if page.url contains '/tools' %}aria-current="page"{% endif %}>Tools</a>
            {% if cv_file.size > 0 %}
            <a href="/assets/cv.pdf" class="py-1 border-b-2 border-transparent hover:text-signal-text">CV</a>
            {% endif %}

            <button id="theme-toggle" type="button" class="btn !p-2" aria-label="Toggle dark mode">
                <svg id="icon-sun" class="hidden w-5 h-5" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                  <path d="M12 2.25a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0V3a.75.75 0 01.75-.75zM7.5 12a4.5 4.5 0 119 0 4.5 4.5 0 01-9 0zM18.894 6.166a.75.75 0 00-1.06-1.06l-1.591 1.59a.75.75 0 101.06 1.061l1.591-1.59zM21.75 12a.75.75 0 01-.75.75h-2.25a.75.75 0 010-1.5H21a.75.75 0 01.75.75zM17.834 18.894a.75.75 0 001.06-1.06l-1.59-1.591a.75.75 0 10-1.061 1.06l1.59 1.591zM12 18a.75.75 0 01.75.75V21a.75.75 0 01-1.5 0v-2.25A.75.75 0 0112 18zM7.758 17.303a.75.75 0 00-1.061-1.06l-1.591 1.59a.75.75 0 001.06 1.061l1.591-1.59zM6 12a.75.75 0 01-.75.75H3a.75.75 0 010-1.5h2.25A.75.75 0 016 12zM6.697 7.757a.75.75 0 001.06-1.06l-1.59-1.591a.75.75 0 00-1.061 1.06l1.59 1.591z" />
                </svg>
                <svg id="icon-moon" class="hidden w-5 h-5" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                    <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path>
                </svg>
            </button>
        </div>
    </div>
</nav>

<script>
    // --- Theme Toggle Logic ---
    const iconSun = document.getElementById('icon-sun');
    const iconMoon = document.getElementById('icon-moon');
    const themeToggleBtn = document.getElementById('theme-toggle');

    // default.html already checked localStorage and added '.dark' to the HTML tag if needed.
    if (document.documentElement.classList.contains('dark')) {
        iconMoon.classList.remove('hidden'); // Show Moon in Dark Mode
    } else {
        iconSun.classList.remove('hidden');  // Show Sun in Light Mode
    }

    themeToggleBtn.addEventListener('click', function() {
        iconSun.classList.toggle('hidden');
        iconMoon.classList.toggle('hidden');

        if (document.documentElement.classList.contains('dark')) {
            document.documentElement.classList.remove('dark');
            localStorage.theme = 'light';
        } else {
            document.documentElement.classList.add('dark');
            localStorage.theme = 'dark';
        }
    });
</script>
