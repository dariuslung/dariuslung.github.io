---
layout: default
title: Weighted RNG
description: Generate random outcomes based on weighted probabilities.
---

<div class="max-w-4xl mx-auto">
    <header class="mb-6 flex items-center gap-4">
        <span class="flex items-center justify-center w-12 h-12 bg-ink text-paper shrink-0">
            <svg class="w-6 h-6 block" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"/><g fill="currentColor" stroke="none"><circle cx="8.5" cy="8.5" r="1.25"/><circle cx="15.5" cy="8.5" r="1.25"/><circle cx="12" cy="12" r="1.25"/><circle cx="8.5" cy="15.5" r="1.25"/><circle cx="15.5" cy="15.5" r="1.25"/></g></svg>
        </span>
        <div>
            <h1 class="text-3xl font-semibold tracking-wide mb-1">Weighted RNG</h1>
            <p class="text-muted">Generate random outcomes based on weighted probabilities.</p>
        </div>
    </header>

    <div class="divider mb-8" aria-hidden="true"><span></span></div>

    <div class="panel flourish p-4 sm:p-6 mb-6">
        <div class="flex gap-2 mb-2 px-1 label">
            <div class="flex-1">Item label</div>
            <div class="w-20 sm:w-24">Weight</div>
            <div class="w-9"></div>
        </div>

        <div id="sample_input" class="hidden gap-2 mb-2 items-center">
            <input type="text" name="label" class="item-input field flex-1 min-w-0 font-medium" placeholder="Label" aria-label="Label">

            <input type="number" name="weight" class="item-input field w-20 sm:w-24 shrink-0 font-mono" value="1" step="0.001" min="0" aria-label="Weight">

            <button class="remove-btn btn !p-2 shrink-0" type="button" aria-label="Remove">
                <svg class="w-5 h-5" aria-hidden="true" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
            </button>
        </div>

        <div id="input_container" class="space-y-2 mb-4"></div>

        <button id="add_input_btn" class="w-full py-3 border border-dashed border-rule-strong text-sm text-muted hover:border-ink hover:text-ink font-medium flex items-center justify-center gap-2" type="button">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
            Add New Item
        </button>

        <div class="mt-6 pt-6 border-t border-rule flex flex-col sm:flex-row gap-3">
            <button id="rand_btn" class="btn btn-primary flex-1 !py-2.5 font-semibold" type="button">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"/><g fill="currentColor" stroke="none"><circle cx="8.5" cy="8.5" r="1.25"/><circle cx="15.5" cy="8.5" r="1.25"/><circle cx="12" cy="12" r="1.25"/><circle cx="8.5" cy="15.5" r="1.25"/><circle cx="15.5" cy="15.5" r="1.25"/></g></svg>
                Pick Random
            </button>
            <button id="dstb_btn" class="btn flex-1 !py-2.5 font-semibold" type="button">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
                Plot Distribution
            </button>
        </div>
    </div>

    <div id="rng_result" class="panel hidden p-4 sm:p-5 mb-6 border-l-4 !border-l-signal" role="status" aria-live="polite">
        <p class="label mb-1">Result</p>
        <p id="rng_winner" class="text-2xl font-semibold break-words"></p>
        <p id="rng_prob" class="font-mono text-sm text-muted mt-1"></p>
    </div>

    <div id="dstb_container" class="panel w-full mb-10 overflow-hidden p-6 empty:hidden"></div>

</div>

<script type="module" src="/assets/js/weighted-rng.js"></script>
